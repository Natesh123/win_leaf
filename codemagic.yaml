workflows:
  ios-android-release:
    name: Build iOS & Android Release
    instance_type: mac_mini_m1
    environment:
      flutter: default
      groups:
        # Add your Codemagic environment variable groups here if needed
        # - app_store_credentials 
        # - google_play_credentials
    scripts:
      - name: Get Flutter Packages
        script: flutter packages pub get
      - name: Build Android App Bundle
        script: flutter build appbundle --release
      - name: Build iOS IPA
        script: |
          find . -name "Podfile" -execdir pod install \;
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/app/outputs/bundle/**/*.aab
      - build/ios/ipa/*.ipa
    publishing:
      # Add publishing steps here later if you want automatic upload to App Store Connect / Google Play
      # For now, it will build the artifacts and you can download or publish them via Codemagic UI.
